# =============================================================================
# ai-dev-arena — cluster config (sourced by bin/install-*.sh and bin/sparkctl.sh)
#
# This file is the single source of truth for the "shape" of the cluster.
# Override any value via env vars when invoking the scripts, or edit this file.
#
# All vars are exported so children inherit them.
# =============================================================================

# ---- Roles ------------------------------------------------------
# One of: head | worker | auto  (auto default means "the script figure it out")
# install-head.sh and install-worker.sh both pin their own role.
SPARK_ROLE="${SPARK_ROLE:-auto}"

# ---- Cluster ----------------------------------------------------
# The 100GbE interface name. On GB10 this is `enp1s0f1np1`.
MN_IF_NAME="${MN_IF_NAME:-enp1s0f1np1}"

# The high-speed point-to-point subnet used by Ray/vLLM for tensor-parallel
# traffic. This is a PRIVATE link between the stacked Sparks, not your LAN --
# NVIDIA's "connect two Sparks (stacked)" guide uses a 192.168.100.0/24 link,
# which is why that's the default. Change CLUSTER_SUBNET for a different range.
CLUSTER_SUBNET="${CLUSTER_SUBNET:-192.168.100}"

# Host octet per role on that link: head is .10, workers are .11, .12, ...
# WORKER_INDEX is 0 for the first worker, 1 for the second, and so on.
HEAD_LINK_OCTET="${HEAD_LINK_OCTET:-10}"
WORKER_INDEX="${WORKER_INDEX:-0}"

# The address every node reports back to the head (the "master" the worker
# reaches over 6379). Always the head's address on the fast link.
HEAD_NODE_IP="${HEAD_NODE_IP:-${CLUSTER_SUBNET}.${HEAD_LINK_OCTET}}"

# This node's own address on the fast link. Auto-detected from the interface
# when possible so a node never has to be told who it is; falls back to the
# role convention. Override VLLM_HOST_IP directly to force a value.
_detect_link_ip() {
  ip -4 -o addr show "$MN_IF_NAME" 2>/dev/null \
    | awk '{print $4}' | cut -d/ -f1 | head -1
}
if [ -z "${VLLM_HOST_IP:-}" ]; then
  VLLM_HOST_IP="$(_detect_link_ip)"
  if [ -z "$VLLM_HOST_IP" ]; then
    case "${SPARK_ROLE:-auto}" in
      worker) VLLM_HOST_IP="${CLUSTER_SUBNET}.$((HEAD_LINK_OCTET + 1 + WORKER_INDEX))" ;;
      *)      VLLM_HOST_IP="${CLUSTER_SUBNET}.${HEAD_LINK_OCTET}" ;;
    esac
  fi
fi

# ---- Image ------------------------------------------------------
VLLM_IMAGE="${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}"

# ---- Models (writer + critic) -----------------------------------
# ai-dev-arena-critique runs TWO models in a writer→critic pipeline:
#
#   WRITER  — Nemotron-3.5-Lightning-30B-A3B  (30B MoE, ~3B active → fast)
#             served on ONE Spark  (--tensor-parallel-size 1)
#   CRITIC  — Llama-3.3-Nemotron-70B-Feedback (70B, purpose-built for review)
#             served ACROSS BOTH Sparks (--tensor-parallel-size 2)  ← the
#             "large model on clustered Sparks" headline of the demo.
#
# The served-name is what the orchestrator sends as the OpenAI "model" field.
WRITER_MODEL_HF="${WRITER_MODEL_HF:-nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4}"
WRITER_SERVED="${WRITER_SERVED:-nemotron-lightning-30b}"
WRITER_TP="${WRITER_TP:-1}"          # one Spark
WRITER_PORT="${WRITER_PORT:-8001}"
# The writer needs a NEWER vLLM than the critic's image (model card requires
# v0.27.1 for the NVFP4 MoE export). It runs in its OWN container, not the
# shared Ray container. The critic keeps using $VLLM_IMAGE (26.05).
WRITER_IMAGE="${WRITER_IMAGE:-vllm/vllm-openai:v0.27.1}"
# DSpark speculative-decoding drafter (model card's recommended GB10 accelerator).
# Set WRITER_DSPARK=1 to enable; the drafter HF repo:
WRITER_DSPARK="${WRITER_DSPARK:-0}"
WRITER_DSPARK_HF="${WRITER_DSPARK_HF:-nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark}"
WRITER_SPEC_TOKENS="${WRITER_SPEC_TOKENS:-3}"

CRITIC_MODEL_HF="${CRITIC_MODEL_HF:-nvidia/Llama-3.3-Nemotron-70B-Feedback}"
CRITIC_SERVED="${CRITIC_SERVED:-llama33-nemotron-70b-feedback}"
CRITIC_TP="${CRITIC_TP:-2}"          # both Sparks (the cluster headline)
CRITIC_PORT="${CRITIC_PORT:-8002}"

# Which Spark hosts the writer's single GPU (the OTHER node still contributes
# its GPU to the critic's TP=2). Default: the first worker's LAN address,
# derived from SPARK_WORKERS below so there's only ONE place to set node
# addresses. Override WRITER_HOST_SPARK to pin it elsewhere.

# NOTE: running both engines concurrently needs GPU memory-fraction tuning
# (writer TP=1 on one node + critic TP=2 spanning both). See docs/CRITIQUE_DESIGN.md
# §"Two engines, shared GPUs" — this MUST be hardware-validated before the demo.

# The HF cache mount (both ranks read from the same directory).
HF_CACHE="${HF_CACHE:-$HOME/.cache/huggingface}"

# The parser file for Nemotron (both nodes need the same file, mounted
# read-only at /app/super_v3_reasoning_parser.py).
PARSER_FILE="${PARSER_FILE:-$HOME/nemotron-super/super_v3_reasoning_parser.py}"

# ---- Ports ------------------------------------------------------
ORCH_PORT="${ORCH_PORT:-8080}"
# (per-model ports are WRITER_PORT / CRITIC_PORT above)

# ---- Node roster -------------------------------------------------
# Space-separated list of "name=user@host" for every node.
# These are LAN addresses (SSH), NOT the fast-link addresses above.
#
# THERE IS NO SENSIBLE DEFAULT FOR THESE -- they are specific to your lab.
# Set them in bin/arena.conf.local (gitignored), or export them before running:
#
#   SPARK_HEAD="head=nvidia@192.0.2.10"
#   SPARK_WORKERS="w1=nvidia@192.0.2.11"
#
# A hostname works just as well as an IP and survives DHCP:
#   SPARK_HEAD="head=nvidia@spark-a.local"
#
# Scripts that need these will fail loudly with this message rather than
# silently trying to reach someone else's hardware.
SPARK_HEAD="${SPARK_HEAD:-}"
SPARK_WORKERS="${SPARK_WORKERS:-}"

# Derive the writer's host from the first worker unless explicitly overridden.
if [ -z "${WRITER_HOST_SPARK:-}" ] && [ -n "$SPARK_WORKERS" ]; then
  _first_worker="${SPARK_WORKERS%% *}"      # name=user@host
  _first_worker="${_first_worker##*=}"      # user@host
  WRITER_HOST_SPARK="${_first_worker##*@}"  # host
fi

# Guard: fail fast and clearly if the roster wasn't configured.
arena_require_roster() {
  local missing=""
  [ -n "$SPARK_HEAD" ]    || missing="SPARK_HEAD"
  [ -n "$SPARK_WORKERS" ] || missing="${missing:+$missing and }SPARK_WORKERS"
  if [ -n "$missing" ]; then
    case "$missing" in
      *" and "*) err "$missing are not set." ;;
      *)         err "$missing is not set." ;;
    esac
    err "This repo ships no default node addresses on purpose."
    err "Create bin/arena.conf.local (gitignored) with your own, e.g.:"
    err '    SPARK_HEAD="head=nvidia@192.0.2.10"'
    err '    SPARK_WORKERS="w1=nvidia@192.0.2.11"'
    return 1
  fi
  return 0
}

# ---- Misc -------------------------------------------------------
# Timeout (s) to wait for vLLM to report "ready" after launch.
# gpt-oss-120b ~ 90s; Nemotron-3-Super-120B ~ 360s — leave the default high.
MODEL_READY_TIMEOUT="${MODEL_READY_TIMEOUT:-420}"

# When SPARK_ROLE=auto and the caller is ambiguous (e.g. a laptop ssh'd to
# the head), the script refuses to guess. Set it explicitly if you want.
# SPARK_ROLE=${SPARK_ROLE:-head or worker}

# --- Back-compat aliases (the seed's install/sparkctl scripts still reference
# these single-model names; the writer is the default "primary" until the
# scripts are rewritten for the two-model pipeline).
DEFAULT_MODEL="${DEFAULT_MODEL:-$WRITER_SERVED}"
VLLM_PORT="${VLLM_PORT:-$WRITER_PORT}"

# ---- Hermes agent (agentic mode) --------------------------------
# The Arena spawns `hermes chat -p $HERMES_PROFILE` to drive the writer as an
# autonomous agent. install-head.sh installs Hermes (if missing) and creates
# this profile pointed at the writer. Context/token/turn caps are tuned so the
# agent fits the 64K writer window and stays fast for a demo.
HERMES_PROFILE="${HERMES_PROFILE:-nemo}"
HERMES_CONTEXT_LEN="${HERMES_CONTEXT_LEN:-64000}"
HERMES_MAX_TOKENS="${HERMES_MAX_TOKENS:-8192}"
HERMES_MAX_TURNS="${HERMES_MAX_TURNS:-12}"

# ---- HuggingFace ------------------------------------------------
# Optional. Set to a HF token for authenticated model downloads (higher rate
# limits + faster, more reliable pulls — matters most for the 141GB critic).
# Put it in bin/arena.conf.local or export HF_TOKEN before launching. Passed into
# the writer/critic containers by launch-writer.sh / launch-critic.sh when set.
HF_TOKEN="${HF_TOKEN:-}"

export SPARK_ROLE VLLM_HOST_IP HEAD_NODE_IP MN_IF_NAME VLLM_IMAGE HF_CACHE PARSER_FILE
export CLUSTER_SUBNET HEAD_LINK_OCTET WORKER_INDEX
export WRITER_MODEL_HF WRITER_SERVED WRITER_TP WRITER_PORT WRITER_HOST_SPARK
export WRITER_IMAGE WRITER_DSPARK WRITER_DSPARK_HF WRITER_SPEC_TOKENS
export CRITIC_MODEL_HF CRITIC_SERVED CRITIC_TP CRITIC_PORT
export DEFAULT_MODEL VLLM_PORT ORCH_PORT SPARK_HEAD SPARK_WORKERS MODEL_READY_TIMEOUT
export HERMES_PROFILE HERMES_CONTEXT_LEN HERMES_MAX_TOKENS HERMES_MAX_TURNS HF_TOKEN

# --- Pretty logging -----------------------------------------------
# $'...' (ANSI-C quoting) makes \033 a real ESC byte; plain '...' would print the
# literal characters "\033[1;33m". Colors only when stdout is a TTY.
if [ -t 1 ]; then
  BLUE=$'\033[1;34m'; GREEN=$'\033[1;32m'; YELLOW=$'\033[1;33m'; RED=$'\033[1;31m'; RESET=$'\033[0m'
else
  BLUE=''; GREEN=''; YELLOW=''; RED=''; RESET=''
fi
c()  { printf '%s[%s]%s %s\n' "$BLUE" "$(date +%H:%M:%S)" "$RESET" "$*"; }
ok() { printf '  %s✓%s %s\n' "$GREEN" "$RESET" "$*"; }
warn(){ printf '  %s!%s %s\n' "$YELLOW" "$RESET" "$*"; }
err(){ printf '  %s✗%s %s\n' "$RED" "$RESET" "$*" >&2; }

# --- Local overrides ---------------------------------------------
# If bin/arena.conf.local exists, source it LAST so it wins. Put ONLY the vars you
# want to override there (node IPs / ports) — do NOT copy the whole file. It's
# gitignored so your local values never get committed.
# Precedence: arena.conf.local  >  environment  >  arena.conf defaults.
# Recursion guard: if .local was (accidentally) made a full copy of this file, the
# guard stops it from re-sourcing itself into a stack overflow.
if [ -z "${_ARENA_CONF_LOADED:-}" ]; then
  _ARENA_CONF_LOADED=1
  _ARENA_CONF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]:-$0}")" && pwd)"
  if [ -f "$_ARENA_CONF_DIR/arena.conf.local" ]; then
    . "$_ARENA_CONF_DIR/arena.conf.local"
  fi
fi
: # ensure this file sources with exit status 0 (never trips `set -e` in callers)
