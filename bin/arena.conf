# =============================================================================
# ai-dev-arena — cluster config (sourced by bin/install-*.sh and bin/sparkctl.sh)
#
# This file is the single source of truth for the "shape" of the cluster.
# Override any value via env vars when invoking the scripts, or edit this file.
#
# All vars are exported so children inherit them.
# =============================================================================

# ---- Roles ------------------------------------------------------
# One of: head | worker | auto  (auto default means "the script figure it out")
# install-head.sh and install-worker.sh both pin their own role.
SPARK_ROLE="${SPARK_ROLE:-auto}"

# ---- Cluster ----------------------------------------------------
# The 100GbE link IP that Ray/vLLM uses. On the HEAD it's 192.168.100.10,
# on each WORKER it's 192.168.100.11, .12, ... (one per GPU).
VLLM_HOST_IP="${VLLM_HOST_IP:-192.168.100.10}"

# The address every node reports back to the head (the "master" the worker
# reaches over 6379). On the head this is the same as VLLM_HOST_IP.
HEAD_NODE_IP="${HEAD_NODE_IP:-192.168.100.10}"

# The 100GbE interface name. On GB10 this is `enp1s0f1np1`.
MN_IF_NAME="${MN_IF_NAME:-enp1s0f1np1}"

# ---- Images / models -------------------------------------------
VLLM_IMAGE="${VLLM_IMAGE:-nvcr.io/nvidia/vllm:26.05-py3}"

# The HF cache mount (both ranks read from the same directory).
HF_CACHE="${HF_CACHE:-$HOME/.cache/huggingface}"

# The parser file for Nemotron (both nodes need the same file, mounted
# read-only at /app/super_v3_reasoning_parser.py).
PARSER_FILE="${PARSER_FILE:-$HOME/nemotron-super/super_v3_reasoning_parser.py}"

# ---- Models ------------------------------------------------------
# The orchestrator's default served-name — the one `gpt-oss-120b` maps to.
DEFAULT_MODEL="${DEFAULT_MODEL:-gpt-oss-120b}"

# ---- Ports ------------------------------------------------------
VLLM_PORT="${VLLM_PORT:-8000}"
ORCH_PORT="${ORCH_PORT:-8080}"

# ---- Node roster (for the head's `status` command) ---------------
# Space-separated list of "name=host:port" for every node INCLUDING the head.
# The head's ssh port is the LAN port (not the 100GbE one).
SPARK_HEAD="${SPARK_HEAD:-sp6b64=nvidia@192.168.1.159}"
SPARK_WORKERS="${SPARK_WORKERS:-spce66=nvidia@192.168.1.149}"
# (add more: e.g. SPARK_WORKERS+=" sp3=nvidia@192.168.1.150 sp4=nvidia@192.168.1.151")

# ---- Misc -------------------------------------------------------
# Timeout (s) to wait for vLLM to report "ready" after launch.
# gpt-oss-120b ~ 90s; Nemotron-3-Super-120B ~ 360s — leave the default high.
MODEL_READY_TIMEOUT="${MODEL_READY_TIMEOUT:-420}"

# When SPARK_ROLE=auto and the caller is ambiguous (e.g. a laptop ssh'd to
# the head), the script refuses to guess. Set it explicitly if you want.
# SPARK_ROLE=${SPARK_ROLE:-head or worker}

export SPARK_ROLE VLLM_HOST_IP HEAD_NODE_IP MN_IF_NAME VLLM_IMAGE HF_CACHE PARSER_FILE
export DEFAULT_MODEL VLLM_PORT ORCH_PORT SPARK_HEAD SPARK_WORKERS MODEL_READY_TIMEOUT

# --- Pretty logging -----------------------------------------------
if [ -t 1 ]; then
  BLUE='\033[1;34m'; GREEN='\033[1;32m'; YELLOW='\033[1;33m'; RED='\033[1;31m'; RESET='\033[0m'
else
  BLUE=''; GREEN=''; YELLOW=''; RED=''; RESET=''
fi
c()  { printf '%s[%s]%s %s\n' "$BLUE" "$(date +%H:%M:%S)" "$RESET" "$*"; }
ok() { printf '  %s✓%s %s\n' "$GREEN" "$RESET" "$*"; }
warn(){ printf '  %s!%s %s\n' "$YELLOW" "$RESET" "$*"; }
err(){ printf '  %s✗%s %s\n' "$RED" "$RESET" "$*" >&2; }
