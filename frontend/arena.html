<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Dev Arena</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0e17; --surface: #131923; --border: #1e2a3a;
  --text: #e8edf5; --muted: #6b829e;
  --accent: #00d4ff; --accent2: #7c3aed;
  --green: #10b981; --red: #ef4444; --yellow: #f59e0b;
}
body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100vh; }

.top-bar { height: 64px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
.logo { font-size: 22px; font-weight: 800; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.timer { font-size: 32px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--accent); transition: color .3s; }
.timer.warning { color: var(--yellow); }
.timer.danger { color: var(--red); }
.timer.final { color: var(--green, #3fb950); }

.main-grid { display: grid; grid-template-columns: 1fr 340px; height: calc(100vh - 64px); }

/* Left panel */
.left-panel { display: flex; flex-direction: column; padding: 24px 32px; overflow: hidden; }
.challenge-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.challenge-label { font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; }
.challenge-title { font-size: 28px; font-weight: 700; }
.challenge-desc { font-size: 15px; color: var(--muted); margin-top: 4px; }

.phase-section { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.phase-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
.phase-name { font-size: 52px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px; transition: color .4s, opacity .4s; }
.phase-msg { font-size: 17px; color: var(--muted); max-width: 600px; line-height: 1.5; }

.phase-dots { display: flex; gap: 10px; margin-top: 24px; }
.phase-dot { width: 48px; height: 6px; border-radius: 3px; background: var(--border); transition: background .4s; }
.phase-dot.active { background: var(--accent); }
.phase-dot.done { background: var(--green); }

.activity-feed { height: 180px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; overflow-y: auto; margin-top: auto; }
.activity-item { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--border); color: var(--muted); }
.activity-item:last-child { color: var(--text); font-weight: 600; }
.activity-time { color: var(--accent); font-variant-numeric: tabular-nums; margin-right: 8px; min-width: 40px; display: inline-block; }

/* Right panel */
.right-panel { border-left: 1px solid var(--border); background: var(--surface); padding: 24px; overflow-y: auto; }
.section-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 16px; }

/* Cluster gauges */
.spark-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 18px; }
.spark-card { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.spark-card.offline { opacity: .55; }
.spark-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.spark-name { font-size: 12px; font-weight: 700; letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62%; }
.spark-role { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
.spark-role.head { color: var(--accent); }
.gauge-row { display: flex; align-items: flex-end; justify-content: space-around; margin-top: 6px; }
.gauge { position: relative; width: 62px; height: 38px; overflow: hidden; }
.gauge svg { width: 62px; height: 62px; transform: rotate(0deg); }
.gauge-track { fill: none; stroke: var(--border); stroke-width: 7; stroke-linecap: round; }
.gauge-arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset .8s ease, stroke .4s; }
.gauge-arc.warn { stroke: var(--yellow); }
.gauge-arc.hot { stroke: var(--red); }
.gauge-val { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.gauge-label { font-size: 9px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-top: 2px; text-align: center; }
.spark-offline { color: var(--muted); font-size: 12px; padding: 12px; }
.model-badge { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.model-badge-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
.model-badge-value { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: .3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Score ring */
.score-ring { width: 160px; height: 160px; margin: 0 auto 24px; position: relative; }
.score-ring svg { width: 160px; height: 160px; transform: rotate(-90deg); }
.score-ring-bg { fill: none; stroke: var(--border); stroke-width: 8; }
.score-ring-fill { fill: none; stroke: var(--accent); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1.2s ease, stroke .5s; }
.score-value { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 42px; font-weight: 800; color: var(--accent); }
.score-max { font-size: 14px; color: var(--muted); font-weight: 400; }

/* Score categories */
.score-cats { display: flex; flex-direction: column; gap: 10px; }
.score-cat { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg); border-radius: 8px; font-size: 13px; }
.score-cat label { color: var(--muted); }
.score-cat .val { font-weight: 700; }

/* Test output */
.test-area { margin-top: 20px; }
.test-line { font-size: 11px; line-height: 1.4; padding: 2px 0; color: var(--muted); white-space: pre-wrap; border-bottom: 1px solid rgba(255,255,255,.03); }
.test-line.pass { color: var(--green); }
.test-line.fail { color: var(--red); }

/* Empty state */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
.empty h2 { font-size: 32px; margin-bottom: 8px; }
.empty p { color: var(--muted); font-size: 15px; }

.phase-name.completed { color: var(--green); animation: pglow 2s ease infinite; }
@keyframes pglow { 0%,100%{opacity:1} 50%{opacity:.7} }
</style>
</head>
<body>

<div class="top-bar">
  <div class="logo">⚡ AI DEV ARENA</div>
  <div class="timer" id="timer">--:--</div>
</div>

<div class="main-grid">
  <div class="left-panel" id="leftPanel">
    <div class="empty" id="emptyState">
      <h2>Ready for a Challenge<span>...</span></h2>
      <p>Start a challenge from the Operator Console</p>
    </div>
    <div id="activeUI" style="display:none; height:100%; flex-direction:column;">
      <div class="challenge-card">
        <div class="challenge-label">CHALLENGE</div>
        <div class="challenge-title" id="cTitle">—</div>
        <div class="challenge-desc" id="cDesc">—</div>
      </div>
      <div class="phase-section">
        <div class="phase-label">CURRENT PHASE</div>
        <div class="phase-name" id="phName">—</div>
        <div class="phase-msg" id="phMsg">Connecting...</div>
        <div class="phase-dots" id="phDots">
          <div class="phase-dot" data-i="0"></div><div class="phase-dot" data-i="1"></div>
          <div class="phase-dot" data-i="2"></div><div class="phase-dot" data-i="3"></div>
          <div class="phase-dot" data-i="4"></div><div class="phase-dot" data-i="5"></div>
        </div>
      </div>
      <div class="activity-feed" id="feed"></div>
    </div>
  </div>

  <div class="right-panel">
    <div class="section-title">📺 CLUSTER — SPARKS</div>
    <div class="spark-grid" id="sparkGrid">
      <div class="spark-offline">scanning cluster…</div>
    </div>
    <div class="model-badge">
      <span class="model-badge-label">ACTIVE MODEL</span>
      <span class="model-badge-value" id="modelBadge">—</span>
    </div>

    <div class="section-title" style="margin-top:22px;">📊 SCOREBOARD</div>
    <div class="score-ring">
      <svg viewBox="0 0 160 160">
        <circle class="score-ring-bg" cx="80" cy="80" r="68"/>
        <circle id="ring" class="score-ring-fill" cx="80" cy="80" r="68"
          stroke-dasharray="427.3" stroke-dashoffset="427.3"/>
      </svg>
      <div class="score-value" id="scoreVal">— <span class="score-max">/100</span></div>
    </div>
    <div class="score-cats">
      <div class="score-cat"><label>Speed</label><span class="val" id="sv-t">—</span></div>
      <div class="score-cat"><label>Tests</label><span class="val" id="sv-q">—</span></div>
      <div class="score-cat"><label>Code Quality</label><span class="val" id="sv-c">—</span></div>
      <div class="score-cat"><label>Requirements</label><span class="val" id="sv-r">—</span></div>
      <div class="score-cat"><label>Efficiency</label><span class="val" id="sv-e">—</span></div>
      <div class="score-cat"><label>Autonomy</label><span class="val" id="sv-o">—</span></div>
    </div>
    <div class="test-area">
      <div class="section-title" style="margin:20px 0 8px;">🧪 LIVE TEST OUTPUT</div>
      <div id="tests"></div>
    </div>
    <div class="critique-area" id="critiqueArea" style="display:none; margin-top:18px;">
      <div class="section-title" style="margin:10px 0 8px;">
        🔎 CODE REVIEW <span style="opacity:.6; font-size:.8em;">— Llama-3.3-Nemotron-70B, across both Sparks</span>
      </div>
      <div id="critiqueVerdict" class="critique-verdict"></div>
      <div id="critiqueSummary" class="critique-summary"></div>
      <ul id="critiqueFindings" class="critique-findings"></ul>
      <div id="critiqueBetter" class="critique-better"></div>
      <pre id="critiqueStream" class="critique-stream" style="display:none;"></pre>
    </div>
  </div>
</div>

<style>
.critique-verdict{display:inline-block;padding:4px 12px;border-radius:6px;font-weight:700;
  font-size:14px;letter-spacing:.4px;margin-bottom:8px}
.critique-verdict.ship{background:#0d3320;color:#4ade80;border:1px solid #166534}
.critique-verdict.ship-with-nits{background:#33280d;color:#fbbf24;border:1px solid #92660e}
.critique-verdict.needs-work{background:#330d0d;color:#f87171;border:1px solid #922}
.critique-verdict.review,.critique-verdict.unavailable{background:#1a2432;color:#93c5fd;border:1px solid #1e3a5f}
.critique-summary{color:#cbd5e1;font-size:14px;line-height:1.5;margin-bottom:10px}
.critique-findings{list-style:none;padding:0;margin:0 0 10px}
.critique-findings li{padding:7px 10px;margin-bottom:6px;border-radius:6px;background:#111a26;
  border-left:3px solid #334155;font-size:13px;line-height:1.45}
.critique-findings li.major{border-left-color:#f87171}
.critique-findings li.minor{border-left-color:#fbbf24}
.critique-findings li.info{border-left-color:#38bdf8}
.critique-findings .kind{font-weight:700;text-transform:uppercase;font-size:11px;
  letter-spacing:.5px;opacity:.8;margin-right:6px}
.critique-better{color:#a5b4fc;font-size:13px;font-style:italic;border-top:1px dashed #263449;
  padding-top:8px;margin-top:4px}
.critique-better:empty{display:none}
.critique-stream{background:#0a0f16;color:#64748b;font-size:11px;max-height:120px;overflow:auto;
  padding:8px;border-radius:6px;white-space:pre-wrap;margin-top:8px}
</style>

<script>
/* ---- constants ---- */
const WS = `ws://${location.host}`;
const PHASES = ['inspecting','planning','calling_llm','editing','testing','critiquing','completed'];
const PHASE_MAP = {
  inspecting:'🔍 Inspecting Code', planning:'📋 Planning', calling_llm:'🧠 Thinking...',
  editing:'✏️ Editing', testing:'🧪 Testing', critiquing:'🔎 Reviewing', completed:'🏆 Complete!',
  error:'⚠️ Error', warning:'⚡ Fallback Applied'
};
const DOTS = document.querySelectorAll('.phase-dot');
const feed = document.getElementById('feed');

let ws = null;
let sid = null;
let sess = null;   // session object from /api/session/{id}
let connectMs = null;
let timerId = null;

/* ---- helpers ---- */
function addLog(msg, elapsed) {
  const d = document.createElement('div'); d.className = 'activity-item';
  d.innerHTML = `<span class="activity-time">${elapsed != null ? elapsed+'s' : '--'}</span>${msg}`;
  feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
}
function setPhase(p) {
  document.getElementById('phName').textContent = PHASE_MAP[p] || p;
  const el = document.getElementById('phName');
  el.className = 'phase-name' + (p==='completed' ? ' completed' : '');
  const ci = PHASES.indexOf(p);
  DOTS.forEach(dot => {
    const di = +dot.dataset.i;
    dot.classList.remove('active','done');
    if (ci >= 0 && di < ci) dot.classList.add('done');
    else if (ci >= 0 && di === ci) dot.classList.add('active');
  });
}
function setScore(sc) {
  if (!sc) return;
  const circ = 427.3, off = circ - (sc.percentage/100)*circ;
  const r = document.getElementById('ring');
  r.style.strokeDashoffset = off;
  r.style.stroke = sc.percentage>=70 ? 'var(--green)' : sc.percentage>=50 ? 'var(--yellow)' : 'var(--red)';
  document.getElementById('scoreVal').innerHTML = sc.overall+'<span class="score-max">/100</span>';
  const bd = sc.breakdown || {};
  const ids = {time_to_result:'sv-t', test_pass_rate:'sv-q', code_quality:'sv-c',
    requirement_completeness:'sv-r', efficiency:'sv-e', human_overrides:'sv-o'};
  for (const [k, id] of Object.entries(ids)) {
    const el = document.getElementById(id);
    if (bd[k]) el.textContent = bd[k].score+'/'+bd[k].max;
  }
}
function stopTimerAt(seconds) {
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (seconds != null) {
    const el = document.getElementById('timer');
    const e = Math.max(0, Math.floor(seconds));
    el.textContent = String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
    el.className = 'timer final';
  }
}
function setTimer() {
  if (!connectMs) return;
  const e = Math.max(0, Math.floor((Date.now()-connectMs)/1000));
  const el = document.getElementById('timer');
  el.textContent = String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0');
  el.className = 'timer'+( e>240?' danger' : e>180?' warning': '');
}

/* ---- Cluster gauges (scalable: renders one card per Spark) ---- */
function gaugeSVG(pct) {
  // semicircle arc, r=45, half-circle length = PI*r = 141.4
  const R = 45, HALF = Math.PI * R;           // ~141.37
  const off = HALF - (Math.max(0, Math.min(100, pct)) / 100) * HALF;
  const cls = pct >= 80 ? 'hot' : pct >= 55 ? 'warn' : '';
  return `<svg viewBox="0 0 120 64" style="width:62px;height:38px;display:block;">
    <path class="gauge-track" d="M 15 60 A 45 45 0 0 1 105 60"/>
    <path class="gauge-arc ${cls}" d="M 15 60 A 45 45 0 0 1 105 60"
      stroke-dasharray="${HALF.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
  </svg>`;
}
function gauge(pct, label) {
  const v = (pct == null) ? '—' : Math.round(pct) + '%';
  return `<div class="gauge-wrap">
    <div class="gauge">${gaugeSVG(pct||0)}<div class="gauge-val">${v}</div></div>
    <div class="gauge-label">${label}</div>
  </div>`;
}
async function updateCluster() {
  try {
    const r = await fetch('/api/telemetry');
    if (!r.ok) return;
    const d = await r.json();
    // model badge
    const mb = document.getElementById('modelBadge');
    if (mb) mb.textContent = (d.model && (d.model.display || d.model.served)) || '—';
    const grid = document.getElementById('sparkGrid');
    if (!grid) return;
    const sparks = d.sparks || [];
    if (!sparks.length) {
      grid.innerHTML = '<div class="spark-offline">no nodes reported</div>';
      return;
    }
    grid.innerHTML = sparks.map(s => {
      const off = !s.online;
      const role = (s.role || '').toUpperCase() || (off ? 'OFFLINE' : '');
      return `<div class="spark-card ${off?'offline':''}">
        <div class="spark-head">
          <span class="spark-name" title="${s.host}">${s.name}</span>
          <span class="spark-role ${s.role==='head'?'head':''}">${role}</span>
        </div>
        <div class="gauge-row">
          ${off ? '<div class="spark-offline" style="width:100%">node unreachable</div>'
                : gauge(s.gpu_util, 'GPU') + gauge(s.mem_util, 'GPU MEM')}
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    // silent — grid keeps last known values
  }
}

/* ---- fetch session details & challenge info ---- */
async function loadSession() {
  try {
    const r = await fetch('/api/session/'+sid);
    if (r.ok) { sess = await r.json(); onSessionReady(sess); }
  } catch{}
}
async function load(challenge_id) {
  try {
    const r = await fetch('/api/challenges');
    if (r.ok) {
      const chs = await r.json();
      const ch = chs.challenges[challenge_id];
      if (ch) {
        document.getElementById('cTitle').textContent = ch.title;
        document.getElementById('cDesc').textContent = ch.description;
      }
    }
  } catch{}
}

/* ---- when WS fires ---- */
function onEvent(ev) {
  if (ev.phase) setPhase(ev.phase);
  if (ev.message) document.getElementById('phMsg').textContent = ev.message;
  if (ev.message) addLog(ev.message, ev.elapsed);
  if (ev.terminal_output) {
    const t = document.getElementById('tests');
    const line = document.createElement('div');
    line.className = 'test-line';
    line.textContent = ev.terminal_output.replace(/\n/g,'\n  ').trim();
    if (/PASS/.test(ev.terminal_output)) line.classList.add('pass');
    else if (/FAIL|ERROR/.test(ev.terminal_output)) line.classList.add('fail');
    t.appendChild(line); t.scrollTop = t.scrollHeight;
  }
  if (ev.score) { setScore(ev.score); stopTimerAt(ev.elapsed); }
  // live reviewer stream (heartbeat preview while the 70B thinks)
  if (ev.critique_stream !== undefined) {
    document.getElementById('critiqueArea').style.display = 'block';
    const st = document.getElementById('critiqueStream');
    st.style.display = 'block';
    st.textContent = ev.critique_stream;
    st.scrollTop = st.scrollHeight;
  }
  // final structured critique
  if (ev.critique) renderCritique(ev.critique);
  if (ev.phase === 'completed') stopTimerAt(ev.elapsed);
  if (ev.phase === 'error') stopTimerAt(ev.elapsed);
}

function renderCritique(c) {
  document.getElementById('critiqueArea').style.display = 'block';
  document.getElementById('critiqueStream').style.display = 'none';
  const verdict = (c.verdict || 'review').toLowerCase();
  const vEl = document.getElementById('critiqueVerdict');
  vEl.className = 'critique-verdict ' + verdict;
  const label = {ship:'✓ SHIP', 'ship-with-nits':'✓ SHIP (nits)',
                 'needs-work':'✗ NEEDS WORK', review:'REVIEW',
                 unavailable:'REVIEWER OFFLINE'}[verdict] || verdict.toUpperCase();
  vEl.textContent = label;
  document.getElementById('critiqueSummary').textContent = c.summary || '';
  const ul = document.getElementById('critiqueFindings');
  ul.innerHTML = '';
  (c.findings || []).forEach(f => {
    const li = document.createElement('li');
    li.className = (f.severity || 'info');
    const kind = document.createElement('span');
    kind.className = 'kind';
    kind.textContent = f.kind || 'note';
    li.appendChild(kind);
    li.appendChild(document.createTextNode(f.note || ''));
    ul.appendChild(li);
  });
  const better = document.getElementById('critiqueBetter');
  better.textContent = c.better_way ? ('💡 ' + c.better_way) : '';
}

/* ---- onSessionReady shows the UI ---- */
function resetView() {
  // Clear all per-run state so a NEW run starts clean (no stale score/phase/timer).
  if (timerId) { clearInterval(timerId); timerId = null; }
  connectMs = null;
  feed.innerHTML = '';
  document.getElementById('tests').innerHTML = '';
  // clear the critique panel for a fresh run
  const ca = document.getElementById('critiqueArea');
  if (ca) {
    ca.style.display = 'none';
    document.getElementById('critiqueVerdict').textContent = '';
    document.getElementById('critiqueVerdict').className = 'critique-verdict';
    document.getElementById('critiqueSummary').textContent = '';
    document.getElementById('critiqueFindings').innerHTML = '';
    document.getElementById('critiqueBetter').textContent = '';
    const cs = document.getElementById('critiqueStream');
    cs.textContent = ''; cs.style.display = 'none';
  }
  // Reset phase dots + name
  DOTS.forEach(dot => dot.classList.remove('active', 'done'));
  const ph = document.getElementById('phName');
  if (ph) { ph.textContent = PHASE_MAP['inspecting'] || 'Inspecting'; ph.className = 'phase-name'; }
  const pmsg = document.getElementById('phMsg');
  if (pmsg) pmsg.textContent = '';
  // Reset timer element to --:-- neutral
  const el = document.getElementById('timer');
  if (el) { el.textContent = '00:00'; el.className = 'timer'; }
  // Reset score ring + breakdown
  const ring = document.getElementById('ring');
  if (ring) { ring.style.strokeDashoffset = '427.3'; ring.style.stroke = 'var(--accent)'; }
  const sv = document.getElementById('scoreVal');
  if (sv) sv.innerHTML = '— <span class="score-max">/100</span>';
  const catIds = ['sv-t','sv-q','sv-c','sv-r','sv-e','sv-o'];
  catIds.forEach(id => { const e = document.getElementById(id); if (e) e.textContent = '—'; });
}

function onSessionReady(s) {
  resetView();
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('activeUI').style.display = 'flex';
  feed.innerHTML = '';
  if (s.challenge_id) load(s.challenge_id);
  // Back-calc connectMs from elapsed
  if (s.started_at) connectMs = new Date(s.started_at*1000).getTime();
  if (!timerId) { timerId = setInterval(setTimer, 1000); setTimer(); }
  // If the session already finished, freeze the clock at final time
  if (s.status === 'completed' || s.status === 'failed' || s.status === 'error') {
    stopTimerAt(s.elapsed);
  }
  // WS connect
  if (ws) ws.close();
  const w = new WebSocket(WS+'/ws/arena/'+sid);
  w.onmessage = e => onEvent(JSON.parse(e.data));
  w.onerror = () => addLog('WS error — trying reconnect...', null);
  w.onclose = () => {
    if (w.readyState !== 1) { setTimeout(() => { if (sid) new WebSocket(WS+'/ws/arena/'+sid); }, 2000); }
  };
}

/* ---- auto-discover running session ---- */
async function discover() {
  try {
    const r = await fetch('/api/running-session');
    if (!r.ok) return;
    const d = await r.json();
    if (d.session_id && d.status && sid !== d.session_id) {
      sid = d.session_id;
      await loadSession();
      if (window._discInterval) { clearInterval(window._discInterval); window._discInterval = null; }
    }
  } catch {}
}

/* ---- bootstrap ---- */
const urlParams = new URLSearchParams(location.search);
const direct = urlParams.get('session_id');
if (direct) { sid = direct; loadSession(); }
else { window._discInterval = setInterval(discover, 2000); discover(); }

/* Cluster gauges — poll live, always-on (shows load even before a run) */
updateCluster();
window._clusterTimer = setInterval(updateCluster, 3000);

/* Instant viewer sync: Operator notifies on Start/Complete via a shared channel. */
if (typeof BroadcastChannel !== 'undefined') {
  try {
    const _bc = new BroadcastChannel('arena_notify');
    _bc.onmessage = (e) => {
      const d = e.data || {};
      if (d.session && d.session !== sid) { sid = d.session; loadSession(); if (window._discInterval) { clearInterval(window._discInterval); window._discInterval = null; } }
    };
  } catch (e) {}
}
/* Also watch for session start from Operator tab */
try {
  window.addEventListener('storage', e => {
    if (e.key === 'arena_session' && e.newValue) {
      sid = e.newValue;
      loadSession();
      if (window._discInterval) { clearInterval(window._discInterval); window._discInterval = null; }
    }
  });
} catch {}
</script>
</body>
